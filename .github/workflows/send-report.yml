name: GitHub Trending Weekly Report

on:
  schedule:
    # 每周日早上 9:00 (UTC+8) = UTC 1:00
    - cron: '0 1 * * 0'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate report & send email
      env:
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
      run: |
        python fetch_trending.py
        echo "=== 生成后根目录文件 ==="
        ls -la github-trending-* 2>/dev/null || echo "⚠️ 未生成 github-trending-* 文件"

    - name: Sync Markdown to Obsidian Gitee
      env:
        GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        GITEE_REPO: ${{ secrets.GITEE_REPO }}      # 例如 luoluo-up/obsidian
        GITEE_BRANCH: ${{ secrets.GITEE_BRANCH }}  # master
      run: |
        echo "📂 开始同步到 Obsidian Gitee 仓库 (技术/技术周报/)..."
        cd "$GITHUB_WORKSPACE"
        echo "=== 工作目录全部文件 ==="
        ls -la
        echo "=== 查找 md 文件 ==="
        ls -la github-trending-*.md 2>/dev/null || echo "⚠️ 根目录没有 github-trending-*.md"

        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        git clone "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git" obsidian-vault

        mkdir -p "obsidian-vault/技术/技术周报"
        if ls github-trending-*.md >/dev/null 2>&1; then
          cp github-trending-*.md "obsidian-vault/技术/技术周报/"
          echo "✅ 已复制: $(ls obsidian-vault/技术/技术周报/ | grep github-trending)"
        else
          echo "❌ 未找到 md 文件，无法同步"
          exit 1
        fi

        cd obsidian-vault
        git add "技术/技术周报/"
        if git diff --cached --quiet; then
          echo "ℹ️ 无变更，跳过提交"
        else
          git commit -m "📊 自动更新: GitHub Trending 周报 ($(date +%Y-%m-%d))"
          git push "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git" "${GITEE_BRANCH}"
          echo "✅ 已推送到 Gitee (分支: ${GITEE_BRANCH})"
        fi

    - name: Upload report as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: github-trending-report
        path: github-trending-*.html
