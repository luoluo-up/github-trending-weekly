name: GitHub Trending Weekly Report

on:
  schedule:
    # 每周日早上 9:00 (UTC+8) = UTC 1:00
    - cron: '0 1 * * 0'
  workflow_dispatch:  # 允许手动触发

jobs:
  send-report:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run fetch trending script
      env:
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
      run: |
        python fetch_trending.py
    
    - name: Upload report as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: github-trending-report
        path: github-trending-*.html

    - name: Sync Markdown to Obsidian Gitee repo
      env:
        GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        GITEE_REPO: ${{ secrets.GITEE_REPO }}
      run: |
        echo "📂 开始同步到 Obsidian Gitee 仓库..."
        
        # 设置 Git 用户
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 使用 token clone Obsidian 仓库
        REPO_URL="https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
        git clone "${REPO_URL}" obsidian-vault
        
        cd obsidian-vault
        
        # 创建目标目录
        mkdir -p "笔记/技术周报"
        
        # 复制生成的 Markdown 文件
        MARKDOWN_FILE=$(ls ../github-trending-*.md | head -1)
        if [ -f "$MARKDOWN_FILE" ]; then
          cp "$MARKDOWN_FILE" "笔记/技术周报/"
          echo "✅ 已复制: $(basename $MARKDOWN_FILE)"
        else
          echo "⚠️ 未找到 Markdown 文件，跳过"
          exit 0
        fi
        
        # 提交并推送
        git add "笔记/技术周报/"
        if git diff --cached --quiet; then
          echo "ℹ️ 无变更，跳过提交"
        else
          git commit -m "📊 自动更新: GitHub Trending 周报 ($(date +%Y-%m-%d))"
          DEFAULT_BRANCH=$(git symbolic-ref --short HEAD)
          git commit -m "📊 自动更新: GitHub Trending 周报 ($(date +%Y-%m-%d))"
          git push origin "${DEFAULT_BRANCH}"
          echo "✅ 已推送到 Gitee Obsidian 仓库"
        fi
